services:
  trade-with-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-with-ai
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/public/data
    environment:
      NODE_ENV: development
    restart: unless-stopped
